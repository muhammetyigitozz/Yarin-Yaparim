[package]
name = "yarin-yaparim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "YarinYaparim"
path = "src/main.rs"

[dependencies]
slint = { version = "1.19", features = ["unstable-winit-030"] }
rusqlite = { version = "0.43", features = ["bundled"] }
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
global-hotkey = "0.10"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
global-hotkey = "0.10"

[build-dependencies]
embed-resource = "3"
slint-build = "1.19"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
